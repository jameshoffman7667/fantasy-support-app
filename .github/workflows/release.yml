name: release

# Release flow: a release is "commit and push main" with a new version in the VERSION file. No tag push is needed.
#
#   trigger   -> a push to main that changes VERSION (the version file; server/ and client/ package.json must
#                equal it, so a release edits all three, but only VERSION starts a run).
#                Fallback: a manually pushed tag vMAJOR.MINOR.PATCH runs the same pipeline.
#   validate  -> reads X.Y.Z; fails if tag vX.Y.Z or its GitHub release already exists, the version files
#                disagree, the CHANGELOG entry is missing/invalid (Short <= 50, Long <= 250 chars) or the
#                deploy/ files are wrong (RELEASE.md with "Update: now|later", compose.yaml pinned to X.Y.Z)
#   images    -> fantasy-manager-server and fantasy-manager-client (linux/amd64), each pushed as
#                X.Y.Z, X.Y, latest (+ a sha- tag, which is the same image and costs nothing)
#   release   -> last job: gh release create vX.Y.Z --target $GITHUB_SHA (this also creates the tag), only
#                after both images are pushed
#
# The two triggers can't both release one version: all runs share one concurrency group (they queue, one at a
# time), and validate fails when the tag or release already exists. A tag created by the workflow's own token
# doesn't start another run (GitHub never triggers workflows from GITHUB_TOKEN events).
#
# Repo secrets (Settings -> Secrets and variables -> Actions): DOCKERHUB_USERNAME (mybadreligon)
# and DOCKERHUB_TOKEN (access token, Read & Write). Deploying is not done here: Claude Code
# deploys a release when deploy/RELEASE.md says "Update: now".

on:
  push:
    branches: [main]
    paths: ["VERSION"]
    # manual fallback only (path filters are not applied to tag pushes)
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      short: ${{ steps.check.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release metadata
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -f VERSION ] || { echo "No VERSION file"; exit 1; }
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$FILE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION ($FILE_VERSION) is not MAJOR.MINOR.PATCH"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # manual fallback: the pushed tag must be vMAJOR.MINOR.PATCH and equal the VERSION file
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1; }
            VERSION="${GITHUB_REF_NAME#v}"
            [ "$FILE_VERSION" = "$VERSION" ] || { echo "VERSION file ($FILE_VERSION) != tag ($VERSION)"; exit 1; }
          else
            VERSION="$FILE_VERSION"
            # push to main: the tag must not exist yet (the release step creates it)
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
              echo "Tag v$VERSION already exists: bump VERSION to a new version"; exit 1
            fi
          fi
          # never release a version twice, whichever trigger got here first
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "GitHub release v$VERSION already exists"; exit 1
          fi
          echo "Release version: $VERSION"
          for f in server/package.json client/package.json; do
            [ "$(node -p "require('./$f').version")" = "$VERSION" ] || { echo "$f version != tag ($VERSION)"; exit 1; }
          done
          # changelog must contain this version with Short <= 50 and Long <= 250 chars
          grep -q "^## v$VERSION " CHANGELOG.md || { echo "CHANGELOG.md has no entry for v$VERSION"; exit 1; }
          SHORT="$(awk -v v="## v$VERSION " 'index($0,v)==1{f=1;next} f&&/^\*\*Short:\*\*/{sub(/^\*\*Short:\*\* /,"");print;exit}' CHANGELOG.md)"
          LONG="$(awk -v v="## v$VERSION " 'index($0,v)==1{f=1;next} f&&/^\*\*Long:\*\*/{sub(/^\*\*Long:\*\* /,"");print;exit}' CHANGELOG.md)"
          [ "${#SHORT}" -gt 0 ] && [ "${#SHORT}" -le 50 ] || { echo "Short is ${#SHORT} chars (max 50)"; exit 1; }
          [ "${#LONG}" -gt 0 ] && [ "${#LONG}" -le 250 ] || { echo "Long is ${#LONG} chars (max 250)"; exit 1; }
          # every release leaves deploy/RELEASE.md (with the fixed Update field) and deploy/compose.yaml
          [ -f deploy/RELEASE.md ] || { echo "deploy/RELEASE.md is missing"; exit 1; }
          [ -f deploy/compose.yaml ] || { echo "deploy/compose.yaml is missing"; exit 1; }
          [ "$(grep -cE '^Update: (now|later)$' deploy/RELEASE.md)" = "1" ] || { echo "deploy/RELEASE.md needs exactly one line 'Update: now' or 'Update: later'"; exit 1; }
          grep -q "^# Release v$VERSION\$" deploy/RELEASE.md || { echo "deploy/RELEASE.md is not for v$VERSION"; exit 1; }
          for img in fantasy-manager-server fantasy-manager-client; do
            grep -q "image: mybadreligon/$img:$VERSION\$" deploy/compose.yaml || { echo "deploy/compose.yaml does not pin $img:$VERSION"; exit 1; }
          done
          ! grep -qE 'image:.*:latest' deploy/compose.yaml || { echo "deploy/compose.yaml must not use :latest"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"

  images:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: fantasy-manager-server
            context: ./server
          - image: fantasy-manager-client
            context: ./client
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: mybadreligon/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # one cache scope per image so the two builds don't overwrite each other's layers
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  release:
    needs: [validate, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: GitHub release (also creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          SHORT: ${{ needs.validate.outputs.short }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION - $SHORT" --notes-file <(awk -v v="## v$VERSION " 'index($0,v)==1{f=1;next} f&&/^## v/{exit} f' CHANGELOG.md)
