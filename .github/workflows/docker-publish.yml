name: Build and push Docker images

# Builds both images (server + client) for linux/amd64 AND linux/arm64
# (covers both typical VPS/desktop hosts and Raspberry-Pi-class home
# servers, which are common for a self-hosted personal tool like this)
# and pushes them to Docker Hub. Runs on every push to main, and can
# also be triggered manually from the Actions tab.
#
# Setup required (one-time, in this repo's GitHub Settings -> Secrets
# and variables -> Actions):
#   DOCKERHUB_USERNAME  your Docker Hub username
#   DOCKERHUB_TOKEN     a Docker Hub *access token*, not your password —
#                        create one at hub.docker.com -> Account Settings
#                        -> Security -> New Access Token (Read & Write scope)
#
# Images end up at:
#   docker.io/<DOCKERHUB_USERNAME>/fantasy-manager-server:latest
#   docker.io/<DOCKERHUB_USERNAME>/fantasy-manager-client:latest
# plus a tag matching the commit SHA for traceability, and a version tag
# when the push is a git tag like v1.2.3.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: fantasy-manager-server
            context: ./server
          - image: fantasy-manager-client
            context: ./client
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 builds on an amd64 runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
