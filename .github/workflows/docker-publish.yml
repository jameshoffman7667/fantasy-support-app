name: Build and push Docker images

# Builds both images (server + client) for linux/amd64 only (v3.5: the
# server runs on a Linux Intel PC, so the arm64 images, which were built
# under slow QEMU emulation, were dropped) and pushes them to Docker Hub. Runs on every push to main, and can
# also be triggered manually from the Actions tab.
#
# Setup required (one-time, in this repo's GitHub Settings -> Secrets
# and variables -> Actions):
#   DOCKERHUB_USERNAME  your Docker Hub username
#   DOCKERHUB_TOKEN     a Docker Hub *access token*, not your password —
#                        create one at hub.docker.com -> Account Settings
#                        -> Security -> New Access Token (Read & Write scope)
#
# Optional (v4.1) — auto-deploy through a Dockhand Git stack once both images are pushed:
#   DOCKHAND_WEBHOOK_URL     the stack's webhook URL from Dockhand (…/api/git/webhooks/<repositoryId>)
#   DOCKHAND_WEBHOOK_SECRET  the webhook secret set in Dockhand (optional; signs the body like GitHub does)
# Without DOCKHAND_WEBHOOK_URL the deploy job does nothing.
#
# Images end up at:
#   docker.io/<DOCKERHUB_USERNAME>/fantasy-manager-server:latest
#   docker.io/<DOCKERHUB_USERNAME>/fantasy-manager-client:latest
# plus a tag matching the commit SHA for traceability, and a version tag
# when the push is a git tag like v1.2.3.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # v4.0: Android-only changes don't need new images (android-apk.yml builds the app).
    paths-ignore:
      - "android/**"
      - ".github/workflows/android-apk.yml"
      - "ANDROID_APK.md"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # A hung build used to run for the 6-hour default before failing. Fail fast instead.
    timeout-minutes: 40
    strategy:
      matrix:
        include:
          - image: fantasy-manager-server
            context: ./server
          - image: fantasy-manager-client
            context: ./client
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One cache scope per image: the server and client jobs used to share a single
          # cache and overwrite each other's layers.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # v4.1: tell Dockhand to redeploy the stack — only after BOTH images (the whole matrix) pushed successfully.
  # The payload imitates GitHub's push event and is signed with X-Hub-Signature-256 (HMAC-SHA256 of the body) when a
  # secret is set. UNVERIFIED against Dockhand itself: check the first run's response in this job's log.
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOOK_URL: ${{ secrets.DOCKHAND_WEBHOOK_URL }}
      HOOK_SECRET: ${{ secrets.DOCKHAND_WEBHOOK_SECRET }}
    steps:
      - name: Call the Dockhand stack webhook
        if: env.HOOK_URL != ''
        run: |
          body=$(printf '{"ref":"%s","after":"%s","repository":{"full_name":"%s","clone_url":"https://github.com/%s.git"},"head_commit":{"id":"%s"}}' \
            "$GITHUB_REF" "$GITHUB_SHA" "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$GITHUB_SHA")
          headers=(-H "Content-Type: application/json" -H "X-GitHub-Event: push" -H "User-Agent: GitHub-Hookshot/fantasy-manager")
          if [ -n "$HOOK_SECRET" ]; then
            sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$HOOK_SECRET" | sed 's/^.* //')
            headers+=(-H "X-Hub-Signature-256: sha256=$sig")
          fi
          code=$(curl -sS -o response.txt -w '%{http_code}' -X POST "${headers[@]}" --data "$body" "$HOOK_URL")
          echo "Dockhand answered HTTP $code:"; head -c 1000 response.txt; echo
          case "$code" in 2*) ;; *) exit 1 ;; esac
      - name: No webhook configured
        if: env.HOOK_URL == ''
        run: echo "DOCKHAND_WEBHOOK_URL isn't set — skipping the auto-deploy."
