name: Build Android app

# v4.0: builds the Android app in android/ — a Trusted Web Activity, i.e. a thin native wrapper that
# opens the web app full screen in Chrome — as a signed APK. The APK is attached to a GitHub release
# called "Android app" (tag android-latest) so it can be downloaded straight onto a phone, and kept as
# a workflow artifact. The run's summary shows the two values the server needs so Android trusts the
# app (ANDROID_APP_PACKAGE / ANDROID_APP_SHA256). Step-by-step setup: ANDROID_APK.md.
#
# Runs when you press "Run workflow" (Actions tab -> Build Android app), and on pushes to main that
# change android/. Web app changes never need a new APK — the app always loads the live site.
#
# One-time setup in this repo's Settings -> Secrets and variables -> Actions:
#   Secrets:
#     ANDROID_KEYSTORE_BASE64    the signing keystore, base64-encoded (ANDROID_APK.md, step 1)
#     ANDROID_KEYSTORE_PASSWORD  its password
#     ANDROID_KEY_ALIAS          optional — the key's alias if it isn't "fantasy"
#     ANDROID_KEY_PASSWORD       optional — only if the key has its own password
#   Variables (optional):
#     ANDROID_HOST               the site's host name, if it differs from android/gradle.properties

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write # to publish the APK on the "Android app" release

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_FILE: ${{ github.workspace }}/../release.keystore
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Without the signing secrets there's nothing to build: a manual run fails with the reason, a
      # push only leaves a warning (so pushing before the Android setup doesn't show a red run).
      - name: Check the signing secrets
        id: secrets
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          MSG="Android app not built: add the repository secrets ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD first (ANDROID_APK.md, steps 2-3)."
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error::$MSG"
            exit 1
          fi
          echo "::warning::$MSG"

      - name: Set up Java 17
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/app/*.gradle
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Decode and check the keystore
        if: steps.secrets.outputs.ready == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'fantasy' }}
        run: |
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > "$KEYSTORE_FILE"
          if ! keytool -list -keystore "$KEYSTORE_FILE" -storepass:env KS_PASS -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::The keystore couldn't be opened with ANDROID_KEYSTORE_PASSWORD, or it has no key called '$KEY_ALIAS' (set ANDROID_KEY_ALIAS if you used another alias)."
            exit 1
          fi

      - name: Android SDK packages
        if: steps.secrets.outputs.ready == 'true'
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null || true
            "$SDKM" --install "platforms;android-36" "build-tools;35.0.0" > /dev/null || echo "sdkmanager failed; the Android Gradle plugin will fetch what it needs"
          else
            echo "sdkmanager not found; the Android Gradle plugin will fetch what it needs"
          fi

      - name: Build the signed APK
        if: steps.secrets.outputs.ready == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'fantasy' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_HOST: ${{ vars.ANDROID_HOST }}
        run: |
          chmod +x gradlew
          set -- -PappVersionCode=${{ github.run_number }} -PappVersionName=1.0.${{ github.run_number }}
          if [ -n "$ANDROID_HOST" ]; then set -- "$@" "-PtwaHost=$ANDROID_HOST"; fi
          ./gradlew --no-daemon --stacktrace assembleRelease "$@"
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed APK was produced (app-release.apk is missing)."
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/fantasy-manager.apk"

      - name: Verify the signature
        if: steps.secrets.outputs.ready == 'true'
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs dist/fantasy-manager.apk > "$RUNNER_TEMP/certs.txt"
            grep -i "SHA-256" "$RUNNER_TEMP/certs.txt" || true
          else
            echo "apksigner not found; skipping the check"
          fi

      - name: Summary and server settings
        if: steps.secrets.outputs.ready == 'true'
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'fantasy' }}
          ANDROID_HOST: ${{ vars.ANDROID_HOST }}
        run: |
          FP=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass:env KS_PASS -alias "$KEY_ALIAS" | awk '/SHA256:/ { print $2; exit }')
          PKG=$(sed -n "s/.*applicationId: '\([^']*\)'.*/\1/p" android/app/build.gradle | head -1)
          HOST="${ANDROID_HOST:-$(sed -n 's/^twaHost=//p' android/gradle.properties | head -1)}"
          {
            echo "### Fantasy Manager Android app 1.0.${{ github.run_number }}"
            echo ""
            echo "Install it from the **Android app** release (fantasy-manager.apk) — see ANDROID_APK.md, step 6."
            echo ""
            echo "Server settings for Android's app-link check (Portainer → the stack's environment variables, then redeploy). They only change if the signing key changes:"
            echo ""
            echo '```'
            echo "ANDROID_APP_PACKAGE=$PKG"
            echo "ANDROID_APP_SHA256=$FP"
            echo '```'
            echo ""
            echo "Check: https://$HOST/.well-known/assetlinks.json should list that package and fingerprint."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ANDROID_APP_PACKAGE=$PKG"
          echo "ANDROID_APP_SHA256=$FP"

      - name: Keep the APK as a workflow artifact
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fantasy-manager-apk-1.0.${{ github.run_number }}
          path: dist/fantasy-manager.apk
          retention-days: 30

      - name: Publish on the "Android app" release
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-latest
          NOTES="Fantasy Manager for Android, version 1.0.${{ github.run_number }} (built from ${GITHUB_SHA::7}). Download fantasy-manager.apk on your phone and open it to install or update. Setup: ANDROID_APK.md."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "Android app" --notes "$NOTES" --latest=false
          fi
          gh release upload "$TAG" dist/fantasy-manager.apk --clobber

      - name: Remove the keystore
        if: always()
        run: rm -f "$KEYSTORE_FILE"
