<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#10171A" />
    <title>Offline - Fantasy Manager</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #10171A; color: #EDF3F1; font-family: Inter, system-ui, sans-serif; text-align: center; padding: 24px; }
      main { max-width: 22rem; }
      h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
      p { color: #8FA39E; line-height: 1.5; margin: 0 0 1.25rem; }
      a { display: inline-block; min-height: 44px; min-width: 44px; box-sizing: border-box; padding: 12px 20px; border-radius: 6px; background: #2B3A3D; color: #EDF3F1; text-decoration: none; font-weight: 500; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Fantasy Manager needs a connection to load your leagues. Check your network, then try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
