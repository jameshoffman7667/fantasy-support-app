server {
    listen 5000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Some browsers are picky about the manifest's content-type.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Never cache the service worker itself — if it were cached, an
    # updated sw.js could take a long time to actually reach returning
    # visitors, defeating the point of shipping a fix.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # v3.9: the Android app's Digital Asset Links file comes from the server container, built from
    # its ANDROID_APP_SHA256 / ANDROID_APP_PACKAGE settings (see ANDROID_APK.md). Must answer 200
    # directly — Android doesn't follow redirects for this file.
    location = /.well-known/assetlinks.json {
        proxy_pass http://server:4000/.well-known/assetlinks.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Everything under /api goes to the server container. "server" here is
    # the Docker Compose service name, resolved via the stack's built-in
    # DNS — not localhost, since these are separate containers.
    location /api/ {
        proxy_pass http://server:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Forward whatever Caddy already determined about the original
        # browser request (http vs https). nginx's own connection to the
        # server container is always plain HTTP internally, so without
        # this the server would think every request was insecure and
        # never set the login cookie's Secure flag.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Single-page app: any other path serves index.html so client-side
    # state/navigation doesn't 404 on a refresh.
    location / {
        try_files $uri /index.html;
    }
}
