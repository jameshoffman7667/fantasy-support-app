# Primary deployment file: pulls prebuilt images from Docker Hub — no
# build context anywhere in this file, so Portainer (or any host) just
# pulls and runs, never builds. That sidesteps needing a compiler
# toolchain on the deployment host entirely (better-sqlite3's native
# build happens once, in CI, not on every deploy — see
# .github/workflows/docker-publish.yml) and makes redeploys fast.
#
# DOCKERHUB_USER defaults to mybadreligon's own published images below,
# so this works as-is with no env var needed. Only override it (export
# in your shell, a root .env next to this file — see .env.example — or
# Portainer's "Environment variables" field) if you've forked this and
# published your own images instead.
#
# Want to build from source instead of pulling? Use
# docker-compose.local-build.yml instead of this file.
services:
  server:
    image: ${DOCKERHUB_USER:-mybadreligon}/fantasy-manager-server:${IMAGE_TAG:-latest}
    container_name: fantasy-manager-server
    environment:
      # ${FANTASYPROS_API_KEY} is resolved at deploy time from either:
      #  - Portainer's "Environment variables" field when deploying this
      #    stack (nothing to upload or commit), or
      #  - a .env file next to this compose file, if you're running
      #    `docker compose up` locally.
      # Either way, the real key is never written into this file or
      # baked into the image.
      - FANTASYPROS_API_KEY=${FANTASYPROS_API_KEY}
      # The shared login password (see the in-app login screen). No
      # username — this is a single-household deployment, not
      # multi-tenant — and, same as the FantasyPros key above, it's
      # resolved at deploy time and never baked into the image.
      - APP_PASSWORD=${APP_PASSWORD}
      - PORT=4000
    ports:
      - "${SERVER_PORT:-4000}:4000"
    volumes:
      # Named volume, not a bind mount — survives image pulls/updates
      # and container recreation. Without this, the SQLite cache/injury
      # history/session would reset every time you pull a new image tag.
      - fantasy-manager-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  client:
    image: ${DOCKERHUB_USER:-mybadreligon}/fantasy-manager-client:${IMAGE_TAG:-latest}
    container_name: fantasy-manager-client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-5000}:5000"
    networks:
      # "default" keeps it able to reach `server` (nginx proxies /api/*
      # there internally) exactly as before. "caddy_net" is new: an
      # existing external network your Caddy reverse proxy is already
      # on, so Caddy can reach this container by name (`client:5000`)
      # without needing the published ${CLIENT_PORT} at all. `server`
      # deliberately isn't added here — nothing external ever talks to
      # it directly, only `client`'s own nginx does.
      - default
      - caddy_net
    restart: unless-stopped

volumes:
  fantasy-manager-data:

networks:
  # Must already exist on this host (`docker network create caddy_net`,
  # or however your Caddy stack created it) — `external: true` means
  # Compose looks it up rather than creating it, and will error out at
  # startup if it doesn't exist yet, rather than silently making a new,
  # disconnected network of the same name.
  caddy_net:
    external: true
