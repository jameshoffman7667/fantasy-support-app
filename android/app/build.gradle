/*
 * Fantasy Manager Android app (v3.9) — a Trusted Web Activity (TWA).
 *
 * The app is a thin native wrapper: it opens https://<twaHost>/ full screen in Chrome (no address bar
 * once the site's /.well-known/assetlinks.json vouches for this app's signing key). Everything you see
 * is the normal web app, so web updates reach the app without rebuilding it.
 *
 * Based on the Android project template of Bubblewrap 1.25 (Google's official TWA generator,
 * https://github.com/GoogleChromeLabs/bubblewrap, Apache License 2.0). Differences from the template:
 * the host, names and version come from gradle.properties / -P flags, the Digital Asset Links
 * statement is generated from the host, release signing reads the keystore from environment
 * variables (set by .github/workflows/android-apk.yml), and there are no launcher shortcuts.
 */

plugins {
    id 'com.android.application'
}

// A gradle property (gradle.properties or -Pname=value) with a fallback.
def prop = { String name, String fallback -> (project.findProperty(name) ?: fallback).toString().trim() }
// Strings handed to AAPT through resValue need apostrophes, quotes and backslashes escaped.
def aapt = { String s -> s.replace('\\', '\\\\').replace("'", "\\'").replace('"', '\\"') }

def twaManifest = [
    applicationId: 'ca.hoffmanhouse.fantasymanager', // Never change this after installing: it is the app's identity.
    hostName: prop('twaHost', 'fantasymanager.hoffmanhouse.ca'), // The domain opened in the TWA.
    launchUrl: '/', // The start path, relative to the domain.
    name: prop('twaAppName', 'Fantasy Manager'), // The application name.
    launcherName: prop('twaLauncherName', 'Fantasy Mgr'), // The name under the launcher icon.
    themeColor: '#10171A', // Status bar (same as the web manifest's theme_color).
    themeColorDark: '#10171A',
    navigationColor: '#10171A', // Navigation bar.
    navigationColorDark: '#10171A',
    navigationDividerColor: '#00000000',
    navigationDividerColorDark: '#00000000',
    backgroundColor: '#10171A', // Splash screen background (the web manifest's background_color).
    enableNotifications: true, // Web push notifications show as this app's notifications.
    splashScreenFadeOutDuration: 300,
    generatorApp: 'fantasy-manager (bubblewrap 1.25 template)',
    fallbackType: 'customtabs', // Without a TWA-capable browser, open in a Custom Tab.
    enableSiteSettingsShortcut: 'true',
    orientation: 'portrait-primary', // Same as the web manifest.
]

if (!(twaManifest.hostName ==~ /^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)+$/)) {
    throw new GradleException("twaHost must be a bare host name like fantasy.example.com (got '${twaManifest.hostName}').")
}

// Release signing: the keystore comes from environment variables (the GitHub workflow decodes it from
// the repository secrets). Without them, assembleRelease produces an unsigned APK.
def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def keystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')

android {
    compileSdkVersion 36
    namespace 'ca.hoffmanhouse.fantasymanager'
    defaultConfig {
        applicationId twaManifest.applicationId
        // Android 7.0+. (Bubblewrap's default is 21; 24 leaves room for the helper library's newer
        // versions, which need 24, and changes nothing for any current phone.)
        minSdkVersion 24
        targetSdkVersion 36
        versionCode prop('appVersionCode', '1').toInteger()
        versionName prop('appVersionName', '1.0')

        // The name for the application
        resValue "string", "appName", aapt(twaManifest.name)

        // The name for the application on the Android Launcher
        resValue "string", "launcherName", aapt(twaManifest.launcherName)

        // The URL that will be used when launching the TWA from the Android Launcher
        def launchUrl = "https://" + twaManifest.hostName + twaManifest.launchUrl
        resValue "string", "launchUrl", launchUrl

        // The hostname is used when building the intent-filter, so the TWA is able to
        // handle Intents to open host url of the application.
        resValue "string", "hostName", twaManifest.hostName

        // Digital Asset Links statement: this app trusts https://<host>. The site's
        // /.well-known/assetlinks.json must list this app's package and signing key in return.
        def assetStatements = '[{"relation": ["delegate_permission/common.handle_all_urls"], ' +
                '"target": {"namespace": "web", "site": "https://' + twaManifest.hostName + '"}}]'
        resValue "string", "assetStatements", assetStatements.replace('"', '\\"')

        // Status bar, navigation bar and splash colours.
        resValue "color", "colorPrimary", twaManifest.themeColor
        resValue "color", "colorPrimaryDark", twaManifest.themeColorDark
        resValue "color", "navigationColor", twaManifest.navigationColor
        resValue "color", "navigationColorDark", twaManifest.navigationColorDark
        resValue "color", "navigationDividerColor", twaManifest.navigationDividerColor
        resValue "color", "navigationDividerColorDark", twaManifest.navigationDividerColorDark
        resValue "color", "backgroundColor", twaManifest.backgroundColor

        // Defines a provider authority for the Splash Screen
        resValue "string", "providerAuthority", twaManifest.applicationId + '.fileprovider'

        // Enables the TrustedWebActivityService (notification delegation).
        resValue "bool", "enableNotification", twaManifest.enableNotifications.toString()

        resValue "integer", "splashScreenFadeOutDuration", twaManifest.splashScreenFadeOutDuration.toString()
        resValue "string", "generatorApp", aapt(twaManifest.generatorApp)
        resValue "string", "fallbackType", twaManifest.fallbackType
        resValue "bool", "enableSiteSettingsShortcut", twaManifest.enableSiteSettingsShortcut
        resValue "string", "orientation", twaManifest.orientation
    }
    signingConfigs {
        release {
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'fantasy'
                // PKCS12 keystores (keytool's default) use the keystore password for the key too.
                keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: keystorePassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            if (keystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    // As in the Bubblewrap template (deprecated in favour of lint {} but still supported by AGP 8.x).
    lintOptions {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Google's Trusted Web Activity helper (same version Bubblewrap 1.25 uses).
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
}
