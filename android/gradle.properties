# Gradle settings for the Fantasy Manager Android app (v3.9).
org.gradle.jvmargs=-Xmx1536m
android.useAndroidX=true

# ---- App settings --------------------------------------------------------------------------------
# The site the app opens. The GitHub workflow overrides it with the repository variable ANDROID_HOST
# when that variable is set (Settings -> Secrets and variables -> Actions -> Variables).
twaHost=fantasymanager.hoffmanhouse.ca
# Names: full name (app info / recents) and the label under the launcher icon (keep it short).
twaAppName=Fantasy Manager
twaLauncherName=Fantasy Mgr
# Version shown in Android's app info. The workflow sets both from its run number, so every build can
# be installed over the previous one (Android refuses an equal or lower versionCode).
appVersionCode=1
appVersionName=1.0
