# Gradle settings for the Fantasy Manager Android app (v4.0).
org.gradle.jvmargs=-Xmx1536m
android.useAndroidX=true

# ---- App settings --------------------------------------------------------------------------------
# The site the app opens: the real public host.
twaHost=fantasy.hoffmanhouse.ca
# Names: full name (app info / recents) and the label under the launcher icon (keep it short).
twaAppName=Fantasy Manager
twaLauncherName=Fantasy Mgr
# Version shown in Android's app info. The release workflow sets both (-PappVersionCode / -PappVersionName):
# versionName = the release version, versionCode = MAJOR*100000000 + MINOR*10000 + PATCH.
appVersionCode=1
appVersionName=1.0
